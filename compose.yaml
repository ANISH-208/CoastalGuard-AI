services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coastguard
      POSTGRES_USER: coastguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coastguard -d coastguard"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://coastguard:${POSTGRES_PASSWORD}@db:5432/coastguard
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set exact CORS_ALLOWED_ORIGINS in .env}
      LOAD_DEMO_FIXTURES: "false"
      ADVISORY_MAX_AGE_HOURS: ${ADVISORY_MAX_AGE_HOURS:-24}
      SOURCE_STALE_AFTER_HOURS: ${SOURCE_STALE_AFTER_HOURS:-24}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
